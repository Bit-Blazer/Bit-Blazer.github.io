{% assign preloader = site.data.settings['preloader'] %}

<!-- Preloader -->
<div class="preloader">
  <div class="centrize full-width">
    <div class="vertical-center">
      <div class="spinner-logo">
        <img src="{{ preloader.logo.image | relative_url }}" alt="{{ preloader.logo.alt }}">
        <div class="spinner-dot"></div>
        <div class="spinner spinner-line"></div>
      </div>
    </div>
  </div>
</div>
